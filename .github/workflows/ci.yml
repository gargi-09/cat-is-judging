name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[maritime,agent,dev]"
      - name: Test
        run: python -m pytest -q

  installed-wheel:
    # Tests run from the source tree, so they can't see files missing from the package.
    # This builds the wheel, installs it into a clean environment outside the repo and
    # runs the smoke script there.
    name: Clean install from the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Install into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install "$(ls dist/*.whl)[maritime]"
      - name: Smoke test outside the repo
        working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/clean/bin/python" "$GITHUB_WORKSPACE/.github/smoke_installed.py"'
